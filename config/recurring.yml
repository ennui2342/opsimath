production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Paused 2026-10-28: Goodreads has removed RSS, so every run 404s and
  # posts an error to Discord. Mark is looking at alternatives; restore
  # this entry (or replace it) when there's a new source.
  # goodreads_sync:
  #   class: GoodreadsSyncJob
  #   queue: default
  #   schedule: every hour at minute 42
  work_known_editions_refresh:
    class: WorkKnownEditionsRefreshJob
    queue: default
    schedule: every day at 2:40am
  wishlist_refresh:
    class: WishlistRefreshJob
    queue: default
    schedule: every day at 2:50am
  ebay_sweep:
    class: EbaySweepJob
    queue: default
    schedule: every day at 4:00am
  pending_decision_sweep:
    class: PendingDecisionSweepJob
    queue: default
    schedule: every day at 3:10am
  catalogue_edits_report:
    class: CatalogueEditsReportJob
    queue: default
    schedule: every 15 minutes
  catalogue_digest:
    class: CatalogueDigestJob
    queue: default
    schedule: every day at 4:30am
  mobile_snapshot:
    class: MobileSnapshotJob
    queue: default
    schedule: every day at 3:20am
