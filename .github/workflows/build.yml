name: Build and push image

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ennui2342/opsimath
  COVER_COMPARE_IMAGE: ghcr.io/ennui2342/opsimath-cover-compare

jobs:
  # One tag for both images built from this push, computed once rather
  # than separately per job — keeps "which commit produced this" easy to
  # correlate across the two images even though they're on independent
  # release cadences in practice (cover-compare changes far less often).
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Generate image tag
        id: tag
        run: echo "tag=1.$(date +%Y%m%d).${{ github.run_number }}" >> $GITHUB_OUTPUT

  build:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The cover-compare sidecar (docs/INTEGRATIONS.md's Phase 3 addendum) —
  # its own image, versioned/pushed the same way as the main app, since
  # it's deployed as its own Deployment in k8s, not baked into the Rails
  # image.
  build-cover-compare:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: services/cover_compare
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.COVER_COMPARE_IMAGE }}:latest
            ${{ env.COVER_COMPARE_IMAGE }}:${{ needs.tag.outputs.tag }}
          cache-from: type=gha,scope=cover-compare
          cache-to: type=gha,mode=max,scope=cover-compare
