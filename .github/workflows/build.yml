name: Build and push image

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ennui2342/opsimath
  COVER_COMPARE_IMAGE: ghcr.io/ennui2342/opsimath-cover-compare

jobs:
  # One tag for both images built from this push, computed once rather
  # than separately per job — keeps "which commit produced this" easy to
  # correlate across the two images even though they're on independent
  # release cadences in practice (cover-compare changes far less often).
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Generate image tag
        id: tag
        run: echo "tag=1.$(date +%Y%m%d).${{ github.run_number }}" >> $GITHUB_OUTPUT

  build:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The cover-compare sidecar (docs/INTEGRATIONS.md's Phase 3 addendum) —
  # its own image, versioned/pushed the same way as the main app, since
  # it's deployed as its own Deployment in k8s, not baked into the Rails
  # image.
  build-cover-compare:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: services/cover_compare
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.COVER_COMPARE_IMAGE }}:latest
            ${{ env.COVER_COMPARE_IMAGE }}:${{ needs.tag.outputs.tag }}
          cache-from: type=gha,scope=cover-compare
          cache-to: type=gha,mode=max,scope=cover-compare

  # Deploy notification — see the "CI deploy notifications" standard in the
  # global Claude Code instructions. A dedicated job (not a step tacked onto
  # one build job) because the two images build in parallel; runs on every
  # outcome and reports success only if all build jobs succeeded.
  notify:
    needs: [tag, build, build-cover-compare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ needs.tag.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set — skipping notification"
            exit 0
          fi
          if [ "$FAILED" = "true" ]; then
            payload=$(jq -n --arg url "$RUN_URL" --arg br "$BRANCH" \
              '{embeds:[{title:"❌ opsimath build failed",description:("Push to `\($br)` failed — no deployment. [View logs](\($url))"),color:15158332,footer:{text:"github.com/ennui2342/opsimath"}}]}')
          else
            payload=$(jq -n --arg tag "$TAG" \
              '{embeds:[{title:"✅ opsimath deployed",description:"Image tag `\($tag)` pushed — Flux will reconcile shortly.",color:3066993,footer:{text:"github.com/ennui2342/opsimath"}}]}')
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$payload"
