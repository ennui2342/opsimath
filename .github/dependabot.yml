# Supply chain for opsimath's own code (see .github/workflows/dependabot-automerge.yml).
#
# - Routine version updates wait out a cooldown after each release, so a
#   malicious or broken release is usually caught and yanked before it's
#   proposed here. Security updates (Dependabot alerts) skip the cooldown.
# - Patch updates are grouped into one PR per ecosystem per week, which
#   merges itself once CI passes (dependabot-automerge.yml); minor updates
#   are a separate weekly group, and majors come one at a time — both for
#   a human. (Until 2026-11-06 patch and minor shared one group, whose PR
#   counted as "minor" whenever it held a single minor bump — so nothing
#   ever auto-merged.)
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
    semver-major-days: 14
  ignore:
    # image_processing 2.x breaks Active Storage variants under Rails 8.1
    # (the :thumb WebP cover variant fails: "undefined method 'new' for
    # nil" — PR #26, 2026-11-06). Revisit when Rails supports it.
    - dependency-name: image_processing
      update-types: ["version-update:semver-major"]
  groups:
    gems-patch:
      update-types: [patch]
    gems-minor:
      update-types: [minor]

# The cover-compare sidecar (Python, its own image).
- package-ecosystem: pip
  directory: "/services/cover_compare"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
    semver-major-days: 14
  groups:
    cover-compare-patch:
      update-types: [patch]
    cover-compare-minor:
      update-types: [minor]

# Base images: the Rails app's and cover-compare's.
- package-ecosystem: docker
  directories: ["/", "/services/cover_compare"]
  schedule:
    interval: weekly
  cooldown:
    default-days: 7

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  groups:
    actions-patch:
      update-types: [patch]
    actions-minor:
      update-types: [minor]
