# Local development only — see docs/PHILOSOPHY.md principle 13 for why
# scheduling/jobs are self-contained (Solid Queue) rather than depending on
# external infrastructure, and principle 21 for the Docker-for-dev decision
# (keeps the host OS clean; no Ruby/Postgres installed on the host at all).
#
# Gems install at container start (bundle_data volume), not baked into the
# image at build time — see Dockerfile.dev's own comment for why an
# earlier, build-time version made Gemfile.lock unreproducible on the
# host. `bundle check || bundle install` is fast (near-instant) once gems
# are already installed, so this costs nothing on ordinary restarts.
#
# `setup` runs db:prepare exactly once, and web/worker/css wait for it to
# *complete* rather than each running db:prepare themselves — confirmed
# live that running it redundantly in multiple services isn't actually
# safe: on a freshly-created volume, two services calling `db:prepare`
# at the same startup moment raced each other's `CREATE DATABASE` and one
# hit `PG::UniqueViolation: duplicate key value ... already exists`.
# db:prepare is idempotent when run *sequentially*, not when run
# *concurrently* from two separate connections — a real distinction, not
# a redundant one.
#
# web + worker + css share one image and one x-app anchor — mirrors
# ~/projects/isfdb-adapter's own compose shape (db + app + a worker-ish
# profile).
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/rails
    - bundle_data:/usr/local/bundle
  environment:
    DATABASE_HOST: db
    DATABASE_USERNAME: postgres
    DATABASE_PASSWORD: postgres

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Postgres 18's official image changed convention: it now wants a
    # single mount at /var/lib/postgresql (it manages a version-specific
    # subdirectory itself) rather than .../postgresql/data — confirmed by
    # a real failed boot before this fix.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  setup:
    <<: *app
    command: bash -c "bundle check || bundle install && bin/rails db:prepare"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: bash -c "bundle check || bundle install && rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: bash -c "bundle check || bundle install && bin/rails solid_queue:start"
    depends_on:
      setup:
        condition: service_completed_successfully

  # Known limitation, confirmed live, not yet resolved: this exits after
  # one build instead of watching continuously — the underlying
  # tailwindcss binary's native filesystem-event watching doesn't reliably
  # cross a Docker-Desktop-on-macOS bind mount. Not a functional blocker
  # (the app runs fine either way); until fixed, rebuild CSS by hand after
  # editing views/Tailwind classes: `docker compose run --rm web bin/rails
  # tailwindcss:build`.
  css:
    <<: *app
    command: bash -c "bundle check || bundle install && bin/rails tailwindcss:watch"
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  bundle_data:
